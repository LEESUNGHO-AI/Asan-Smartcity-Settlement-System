name: 집행결과 제출 양식 생성

on:
  workflow_dispatch:
    inputs:
      org:
        description: '기관 코드 (JEIL / HOSEO / CNI / KAIST / ASAN)'
        required: true
        default: 'JEIL'
      from:
        description: '대상기간 시작 (YYYY-MM-DD)'
        required: true
        default: '2025-10-01'
      to:
        description: '대상기간 종료 (YYYY-MM-DD)'
        required: true
        default: '2026-06-30'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: 원장 검증
        id: v
        run: |
          set +e
          node scripts/validate.js --json > validation-report.json
          n=$(python3 -c "import json;d=json.load(open('validation-report.json'));print(sum(1 for f in d['결과'] if f['rule']=='SCHEMA'))")
          echo "schema=$n" >> $GITHUB_OUTPUT
          node scripts/validate.js | tail -30
          if [ "$n" -gt 0 ]; then
            echo "::error::데이터 구조 오류 $n 건 — 양식을 생성하지 않습니다."
          fi
          exit 0

      - name: 집행결과 제출 양식 생성
        if: steps.v.outputs.schema == '0'
        run: |
          node scripts/generate-report.js \
            --org "${{ inputs.org }}" \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}"

      - uses: actions/upload-artifact@v4
        with:
          name: 집행결과제출_${{ inputs.org }}_${{ inputs.to }}
          path: output/*.docx
          retention-days: 90
