name: 대시보드 배포

on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'data/**']
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      # secrets 는 if: 조건에서 직접 참조할 수 없으므로 env 로 옮긴다
      DASHBOARD_TOKEN: ${{ secrets.DASHBOARD_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      - name: 집계 생성 (개인정보 미포함 검사 포함)
        run: node scripts/publish-dashboard.js

      - name: 같은 저장소에 반영
        run: |
          if git diff --quiet dashboard/; then echo "변경 없음"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          git commit -m "chore: 대시보드 집계 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git pull --rebase origin main
          git push

      # 저장소를 비공개로 전환한 뒤에만 쓰는 단계.
      # 변수 DASHBOARD_REPO 를 지정해야 동작하며, 없으면 조용히 건너뛴다.
      # (Settings → Secrets and variables → Actions → Variables 탭)
      - name: 공개 저장소로 배포 (선택)
        if: vars.DASHBOARD_REPO != '' && env.DASHBOARD_TOKEN != ''
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ env.DASHBOARD_TOKEN }}
          external_repository: ${{ vars.DASHBOARD_REPO }}
          publish_branch: gh-pages
          publish_dir: ./dashboard
          commit_message: '집계 갱신'
