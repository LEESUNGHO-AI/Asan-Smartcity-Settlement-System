name: 집행결과 제출 양식 생성

on:
  workflow_dispatch:
    inputs:
      org:
        description: '기관 코드 (JEIL / HOSEO / CNI / KAIST / ASAN)'
        required: true
        default: 'JEIL'
      from:
        description: '대상기간 시작 (YYYY-MM-DD)'
        required: true
        default: '2025-10-01'
      to:
        description: '대상기간 종료 (YYYY-MM-DD)'
        required: true
        default: '2026-06-30'

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: 원장 검증 (오류 시 생성 중단)
        run: node scripts/validate.js

      - name: 집행결과 제출 양식 생성
        run: |
          node scripts/generate-report.js \
            --org "${{ inputs.org }}" \
            --from "${{ inputs.from }}" \
            --to "${{ inputs.to }}"

      - uses: actions/upload-artifact@v4
        with:
          name: 집행결과제출_${{ inputs.org }}_${{ inputs.to }}
          path: output/*.docx
          retention-days: 90
