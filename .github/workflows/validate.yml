name: 원장 검증

on:
  push:
    paths: ['data/**', 'schema/**', 'codes/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'schema/**', 'codes/**', 'scripts/**']
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install
      - name: 스키마 및 법정요건 검증
        run: node scripts/validate.js
      - name: 검증결과 JSON 산출
        if: always()
        run: node scripts/validate.js --json > validation-report.json || true
      - name: Slack 알림 (main 브랜치·정기실행만)
        if: always() && (github.ref == 'refs/heads/main' || github.event_name == 'schedule')
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-slack.js --file validation-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: validation-report
          path: validation-report.json
