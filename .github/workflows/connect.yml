name: 단위시스템 연동

on:
  schedule:
    - cron: '30 21 * * *'   # 매일 06:30 KST (BMS/WBS 갱신 후)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  connect:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: npm ci
      - run: pip install openpyxl

      - name: 단위시스템 → 원장 연동
        run: node scripts/connect-units.js > connect.log 2>&1 || true
      - run: cat connect.log

      - name: 산출물·대시보드 갱신
        run: |
          node scripts/generate-report.js --org JEIL --from 2023-12-01 --to 2026-12-31 --status "확정,제출완료" || true
          node scripts/generate-legal-forms.js --org JEIL --status "확정,제출완료" || true
          node scripts/generate-completion.js --all || true
          python3 scripts/export-workbook.py || true
          node scripts/publish-dashboard.js

      - name: 커밋
        run: |
          if git diff --quiet data/ dashboard/ && [ -z "$(git status --porcelain output/ 2>/dev/null)" ]; then
            echo "변경 없음"; exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ dashboard/ output/ 2>/dev/null || git add data/ dashboard/
          git commit -m "chore: 단위시스템 연동 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git pull --rebase origin main
          git push
