name: Notion DB 생성

on:
  workflow_dispatch:
    inputs:
      mode:
        description: '작업 방식'
        type: choice
        options:
          - 미리보기 (아무것도 만들지 않음)
          - 새로 생성
          - 기존 DB 속성 보강
        default: '미리보기 (아무것도 만들지 않음)'
      db:
        description: '대상 DB'
        type: choice
        options:
          - 전체
          - evidence
          - contracts
          - assets
          - completion
        default: '전체'

jobs:
  setup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: 실행
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_PARENT_PAGE: ${{ secrets.NOTION_PARENT_PAGE }}
          NOTION_EVIDENCE_DB: ${{ secrets.NOTION_EVIDENCE_DB }}
          NOTION_CONTRACTS_DB: ${{ secrets.NOTION_CONTRACTS_DB }}
          NOTION_ASSETS_DB: ${{ secrets.NOTION_ASSETS_DB }}
          NOTION_COMPLETION_DB: ${{ secrets.NOTION_COMPLETION_DB }}
        run: |
          ARGS=""
          case "${{ inputs.mode }}" in
            "미리보기"*) ARGS="--dry-run" ;;
            "기존 DB 속성 보강") ARGS="--update" ;;
          esac
          if [ "${{ inputs.db }}" != "전체" ]; then ARGS="$ARGS --db ${{ inputs.db }}"; fi

          echo "실행: node integrations/notion/setup-databases.js $ARGS"
          echo "────────────────────────────────────────────"
          node integrations/notion/setup-databases.js $ARGS | tee result.txt

      - name: 결과 요약
        if: always()
        run: |
          echo "## Notion DB 작업 결과" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat result.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(출력 없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

