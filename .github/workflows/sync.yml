name: 일일 동기화

on:
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:
    inputs:
      dry_run:
        description: '변경사항만 확인 (커밋하지 않음)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ledger-write
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci

      - name: Notion 설정 확인
        id: nt
        run: |
          if [ -z "${{ secrets.NOTION_TOKEN }}" ]; then
            echo "::warning::NOTION_TOKEN 미설정 — 이 단계를 건너뜁니다."
            echo "ok=false" >> $GITHUB_OUTPUT
          else echo "ok=true" >> $GITHUB_OUTPUT; fi

      - name: Notion → 원장 동기화
        if: steps.nt.outputs.ok == 'true'
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_EVIDENCE_DB: ${{ secrets.NOTION_EVIDENCE_DB }}
          NOTION_CONTRACTS_DB: ${{ secrets.NOTION_CONTRACTS_DB }}
          NOTION_ASSETS_DB: ${{ secrets.NOTION_ASSETS_DB }}
          NOTION_COMPLETION_DB: ${{ secrets.NOTION_COMPLETION_DB }}
          DRY: ${{ github.event.inputs.dry_run }}
        run: |
          ARGS=""
          if [ "$DRY" = "true" ]; then ARGS="--dry-run"; fi
          node scripts/sync-notion.js $ARGS | tee sync.log

      - name: 준공서류·대시보드 갱신
        run: |
          node scripts/generate-completion.js --all || true
          node scripts/publish-dashboard.js

      - name: 법정요건 검증
        id: validate
        run: |
          node scripts/validate.js --json > validation-report.json || true
          node scripts/validate.js || echo "failed=true" >> $GITHUB_OUTPUT

      - name: 변경사항 커밋
        if: github.event.inputs.dry_run != 'true'
        run: |
          if git diff --quiet data/; then
            echo "원장 변경 없음"; exit 0
          fi
          ADDED=$(grep -o '추가 [0-9]*건' sync.log | head -1 || echo '')
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git commit -m "data(evidence): Notion 동기화 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST) ${ADDED}"
          git pull --rebase origin main
          git push

      - name: Slack 알림
        if: always()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-slack.js --file validation-report.json

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sync-report
          path: |
            validation-report.json
            sync-warnings.txt
            sync.log
          retention-days: 30
