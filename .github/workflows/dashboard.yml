name: 대시보드 배포

on:
  push:
    branches: [main]
    paths: ['dashboard/**', 'data/**']
  schedule:
    - cron: '0 22 * * *'   # 매일 07:00 KST
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '20', cache: 'npm' }
      - run: npm ci

      - name: 집계 생성 (개인정보 미포함 검사 포함)
        run: node scripts/publish-dashboard.js

      - name: 배포 대상 확인
        id: chk
        run: |
          if [ -z "${{ secrets.DASHBOARD_TOKEN }}" ]; then
            echo "ready=false" >> $GITHUB_OUTPUT
            echo "::notice::DASHBOARD_TOKEN 미설정 — 공개 저장소 배포를 건너뜁니다."
            echo "::notice::현재 저장소가 공개라면 dashboard/ 가 이미 GitHub Pages 로 서빙되므로 별도 배포가 필요 없습니다."
          else
            echo "ready=true" >> $GITHUB_OUTPUT
          fi

      - name: 집계 커밋 (같은 저장소 Pages 사용 시)
        if: steps.chk.outputs.ready != 'true'
        run: |
          if git diff --quiet dashboard/; then echo "변경 없음"; exit 0; fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dashboard/
          git commit -m "chore: 대시보드 집계 갱신 ($(TZ=Asia/Seoul date '+%Y-%m-%d %H:%M') KST)"
          git push

      - name: 공개 저장소로 배포
        if: steps.chk.outputs.ready == 'true'
        uses: peaceiris/actions-gh-pages@v4
        with:
          personal_token: ${{ secrets.DASHBOARD_TOKEN }}
          external_repository: LEESUNGHO-AI/Asan-Smartcity-Settlement-Dashboard
          publish_branch: gh-pages
          publish_dir: ./dashboard
          commit_message: '집계 갱신'
