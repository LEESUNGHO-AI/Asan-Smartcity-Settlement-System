name: 원장 검증

on:
  push:
    paths: ['data/**', 'schema/**', 'codes/**', 'scripts/**']
  pull_request:
    paths: ['data/**', 'schema/**', 'codes/**', 'scripts/**']
  schedule:
    - cron: '0 22 * * *'
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci || npm install || true

      - name: 검증 실행 (실패해도 job 은 계속)
        continue-on-error: true
        run: |
          node scripts/validate.js --json > validation-report.json 2>/dev/null || true
          node scripts/validate.js > validate.txt 2>&1 || true
          echo "## 정산 원장 검증 결과" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 validate.txt >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "(로그 없음)" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Slack 알림
        if: always()
        continue-on-error: true
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: node scripts/notify-slack.js --file validation-report.json || true

      - uses: actions/upload-artifact@v4
        if: always()
        continue-on-error: true
        with:
          name: validation-report
          path: validation-report.json
